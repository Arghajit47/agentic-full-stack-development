name: Automation Tests

on:
  workflow_run:
    workflows: ["Deploy to Netlify"]
    types:
      - completed

permissions:
  contents: read

jobs:
  automation:
    name: Run Automation Test Suite
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: test-automation/package-lock.json

      - name: Install test-automation dependencies
        working-directory: test-automation
        run: npm ci

      - name: Install Playwright browsers
        working-directory: test-automation
        run: npx playwright install --with-deps chromium

      - name: Run backend tests
        working-directory: test-automation
        continue-on-error: true
        run: npm run test:api
        env:
          BASE_URL: ${{ secrets.NETLIFY_SITE_URL }}
          PULSE_REPORT_DIR: pulse-report-backend

      - name: Generate backend pulse report
        if: always()
        working-directory: test-automation
        run: npx generate-pulse-report --outputDir pulse-report-backend

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-backend-reports
          path: test-automation/pulse-report-backend/
          retention-days: 7

      - name: Run frontend integration tests
        working-directory: test-automation
        continue-on-error: true
        run: npm run test:ui
        env:
          BASE_URL: ${{ secrets.NETLIFY_SITE_URL }}
          PULSE_REPORT_DIR: pulse-report-frontend

      - name: Generate frontend pulse report
        if: always()
        working-directory: test-automation
        run: npx generate-pulse-report --outputDir pulse-report-frontend

      - name: Upload frontend integration test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-frontend-reports
          path: test-automation/pulse-report-frontend/
          retention-days: 7

      - name: Run lighthouse tests
        working-directory: test-automation
        continue-on-error: true
        run: npm run test:lighthouse
        env:
          BASE_URL: ${{ secrets.NETLIFY_SITE_URL }}
          PULSE_REPORT_DIR: pulse-report-lighthouse

      - name: Generate lighthouse pulse report
        if: always()
        working-directory: test-automation
        run: npx generate-pulse-report --outputDir pulse-report-lighthouse

      - name: Upload lighthouse test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-lighthouse-reports
          path: test-automation/pulse-report-lighthouse/
          retention-days: 7
