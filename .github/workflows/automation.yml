name: Automation Tests

on:
  workflow_run:
    workflows: ["Deploy to Netlify"]
    types:
      - completed

permissions:
  contents: read

jobs:
  automation:
    name: Run Automation Test Suite
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: test-automation/package-lock.json

      - name: Install test-automation dependencies
        working-directory: test-automation
        run: npm ci

      - name: Install Playwright browsers
        working-directory: test-automation
        run: npx playwright install --with-deps chromium

      - name: Run backend tests
        working-directory: test-automation
        run: npm run test:api
        env:
          BASE_URL: ${{ secrets.NETLIFY_SITE_URL }}

      - name: Run frontend integration tests
        working-directory: test-automation
        run: npm run test:ui
        env:
          BASE_URL: ${{ secrets.NETLIFY_SITE_URL }}

      - name: Run smoke tests
        working-directory: test-automation
        run: npm run test:smoke
        env:
          BASE_URL: ${{ secrets.NETLIFY_SITE_URL }}

      - name: Run lighthouse tests
        working-directory: test-automation
        run: npm run test:lighthouse
        env:
          BASE_URL: ${{ secrets.NETLIFY_SITE_URL }}

      - name: Generate pulse report
        if: always()
        working-directory: test-automation
        run: npx generate-pulse-report

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-reports
          path: test-automation/pulse-report/
          retention-days: 14
