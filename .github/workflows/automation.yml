name: Automation Tests

on:
  workflow_run:
    workflows: ["Deploy to Netlify"]
    types:
      - completed

jobs:
  automation:
    name: Run Automation Test Suite
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: test-automation/package-lock.json

      - name: Install test-automation dependencies
        working-directory: test-automation
        run: npm ci

      - name: Install Playwright browsers
        working-directory: test-automation
        run: npx playwright install --with-deps chromium

      - name: Run backend tests
        working-directory: test-automation
        run: npm run test:api
        env:
          BASE_URL: ${{ secrets.NETLIFY_SITE_URL }}

      - name: Run frontend integration tests
        working-directory: test-automation
        run: npm run test:ui
        env:
          BASE_URL: ${{ secrets.NETLIFY_SITE_URL }}

      - name: Run smoke tests
        working-directory: test-automation
        run: npm run test:smoke
        env:
          BASE_URL: ${{ secrets.NETLIFY_SITE_URL }}

      - name: Run lighthouse tests
        working-directory: test-automation
        run: npm run test:lighthouse
        env:
          BASE_URL: ${{ secrets.NETLIFY_SITE_URL }}

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: test-automation/playwright-report/
          retention-days: 14
