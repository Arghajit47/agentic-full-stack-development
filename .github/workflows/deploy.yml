name: Deploy to Netlify

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare database and run tests
        run: npm run db:prepare && npm run test
        env:
          DATABASE_URL: "file:./prisma/dev.db"

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        run: netlify deploy --prod --build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DATABASE_URL: "file:./prisma/dev.db"

      - name: Install test-automation dependencies
        working-directory: test-automation
        run: npm ci

      - name: Install Playwright browsers
        working-directory: test-automation
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: test-automation
        run: npm run test:smoke
        env:
          BASE_URL: ${{ secrets.NETLIFY_SITE_URL }}

      - name: Generate pulse report
        if: always()
        working-directory: test-automation
        run: npx generate-pulse-report

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-smoke-suite-reports
          path: test-automation/pulse-report/
          retention-days: 1
