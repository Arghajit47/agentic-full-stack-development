name: Automated Development Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  # Step 1: Run automated tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test
        
      - name: Build
        run: npm run build

  # Step 2: Trigger Code Review Agent
  code-review:
    name: AI Code Review
    needs: test
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Details
        id: pr
        run: |
          echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "pr_title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
          
      - name: Extract JIRA ticket
        id: jira
        run: |
          TITLE="${{ steps.pr.outputs.pr_title }}"
          TICKET=$(echo "$TITLE" | grep -oE '[A-Z]+-[0-9]+' || echo "")
          echo "ticket=$TICKET" >> $GITHUB_OUTPUT

      - name: Trigger Code Review Agent
        if: steps.jira.outputs.ticket != ''
        run: |
          echo "Would trigger: /code-review PR #${{ steps.pr.outputs.pr_number }}"
          echo "JIRA Ticket: ${{ steps.jira.outputs.ticket }}"
          # TODO: Integrate with Hermes Agent API when available
          # For now, this is a placeholder for the webhook/API call

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 **Automated Pipeline Triggered**\n\n' +
                    '✅ Tests passed\n' +
                    '⏳ Code review agent queued\n' +
                    '⏳ QA agent will run after review approval\n\n' +
                    `📋 JIRA: ${{ steps.jira.outputs.ticket }}`
            })

  # Step 3: Label PR based on JIRA ticket type
  label-pr:
    name: Auto-label PR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Extract JIRA ticket and label
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const ticketMatch = title.match(/\[?([A-Z]+-\d+)\]?/);
            
            if (ticketMatch) {
              const ticket = ticketMatch[1];
              
              // Label based on ticket prefix or content
              let labels = [];
              if (title.toLowerCase().includes('frontend')) labels.push('frontend');
              if (title.toLowerCase().includes('backend')) labels.push('backend');
              if (title.toLowerCase().includes('integration')) labels.push('integration');
              if (title.toLowerCase().includes('fix')) labels.push('bugfix');
              
              if (labels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: labels
                });
              }
            }

# Future: Add webhook trigger for QA agent after review approval
# This would be configured in GitHub repo settings -> Webhooks
